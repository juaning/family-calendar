services:
  backend:
    platform: linux/arm64
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app/data:/app/data          # SQLite persistence
      - ./secrets:/app/secrets                # Google credentials (Phase 1)
    restart: unless-stopped

  frontend:
    platform: linux/arm64
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
